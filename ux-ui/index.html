<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IF ONLY — UX/UI Prototype</title><style>:root{--b:#07090d;--p:#11161e;--l:#303844;--t:#f3f3ef;--m:#9aa3ad}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#303744,#07090d 55%);color:var(--t);font:15px Arial,sans-serif}button{font:inherit}.wrap{max-width:1200px;margin:auto;padding:28px}.screen{display:none;min-height:100vh}.on{display:block}.brand{font-size:clamp(55px,10vw,110px);font-weight:900;letter-spacing:-6px;margin-top:18vh}.muted,.tiny{color:var(--m)}.tiny{text-transform:uppercase;letter-spacing:2px;font-size:11px}.menu{display:grid;gap:10px;width:300px;margin-top:30px}.btn,.ch,.ghost{background:transparent;color:inherit;border:1px solid var(--l);padding:13px 16px;cursor:pointer;text-align:left}.btn:hover,.ch:hover,.ch.sel,.ghost:hover{background:#fff;color:#07090d}.bar{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding-bottom:15px;margin-bottom:20px}.grid{display:grid;grid-template-columns:230px 1fr;gap:18px}.side,.panel{background:#10141be8;border:1px solid var(--l);border-radius:12px;padding:16px}.ch{width:100%;border-width:0 0 0 2px;border-color:transparent;color:var(--m);margin:2px 0}.hero{min-height:340px;padding:28px;display:flex;flex-direction:column;justify-content:end;border:1px solid var(--l);border-radius:10px;background:linear-gradient(180deg,transparent,#080a0dcc),radial-gradient(circle at 65% 30%,#394352,#11161e 50%,#080a0d)}h1{font-size:42px;margin:8px 0}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tag{border:1px solid var(--l);border-radius:99px;padding:6px 9px;font-size:10px;color:var(--m)}.actions{display:flex;gap:8px;margin-top:15px}.primary{border:0;background:#eee;color:#07090d;padding:12px 18px;cursor:pointer}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.node{border:1px solid var(--l);padding:13px 5px;text-align:center;font-size:11px;color:var(--m)}.hud{height:520px;position:relative;border:1px solid var(--l);border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#343d49,#121820 48%,#080a0d)}.hud>*{position:absolute}.hudtop{top:18px;left:18px;right:18px;display:flex;justify-content:space-between}.card{background:#05070a99;border:1px solid #ffffff22;padding:10px}.obj{max-width:300px}.center{left:50%;top:45%;transform:translate(-50%,-50%);text-align:center}.key{display:inline-block;border:1px solid white;padding:8px;margin-top:10px}.dialog{left:7%;right:7%;bottom:18px;background:#05070ae8;border:1px solid #ffffff22;padding:16px}.choice{display:block;width:100%;background:transparent;border:1px solid var(--l);color:inherit;text-align:left;padding:9px;margin-top:6px;cursor:pointer}.choice:hover{background:#fff;color:#07090d}.bottom{bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between}.timer{font-size:22px}.danger{color:#f1b3b3}.map{height:430px;border:1px solid var(--l);border-radius:10px;position:relative;background:radial-gradient(circle,#303946,#0a0d12 65%)}.place{position:absolute;transform:translate(-50%,-50%);text-align:center}.dot{width:13px;height:13px;border:2px solid white;border-radius:50%;margin:auto}.mem{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.memory{border:1px solid var(--l);padding:18px;min-height:100px}.lock{opacity:.35}@media(max-width:800px){.grid{grid-template-columns:1fr}.flow,.mem{grid-template-columns:1fr}.node{padding:10px}.hud{height:600px}}
</style></head><body><main class="wrap"><section id="start" class="screen on"><div class="tiny">ĐỒ ÁN TỐT NGHIỆP · UX / UI PROTOTYPE</div><div class="brand">IF ONLY</div><p class="muted">Arthur × Lauren · Narrative Mystery</p><div class="menu"><button class="btn" onclick="go()">BẮT ĐẦU</button><button class="btn" onclick="info('CÁCH CHƠI','Chọn 1 trong 5 chapter. Thử Character Switch, Interaction, Dialogue, Memory và Countdown ở Chapter 5.')">CÁCH CHƠI</button><button class="btn" onclick="info('CÀI ĐẶT','Third Person · Subtitles ON · Interaction [E] · Audio ON')">CÀI ĐẶT</button></div></section><section id="game" class="screen"><div class="bar"><b>IF ONLY / UX · UI</b><button class="ghost" onclick="show('start')">MENU</button></div><div class="grid"><aside class="side"><div class="tiny">CHAPTERS</div><div id="chs"></div><hr><button class="ch" onclick="panel('memory')">✦ MEMORY ARCHIVE</button><button class="ch" onclick="panel('map')">⌖ BẢN ĐỒ</button></aside><section id="main"></section></div></section></main><script>const D=[['CUỘC GẶP KỲ ẢO','Russian Hill Apartment','Exploration · Interaction · Character Switch','Khám phá căn hộ và tìm hiểu dấu hiệu bất thường.'],['RANH GIỚI HÔN MÊ','Memorial Hospital · Phòng 712','Stealth · Spirit Traversal · Investigation','Tiếp cận phòng 712 mà không bị phát hiện.'],['MẢNH GHÉP SUTTER','Sutter Street · Victory Project','Dual-Perspective · Puzzle · Memory','Tìm manh mối liên kết Sutter Street với Victory Project.'],['HOÀNG HÔN BÌNH YÊN','Carmel Beach House','Exploration · Dialogue · Hope','Khám phá các kỷ vật và mảnh ký ức.'],['CUỘC CHẠY ĐUA 72 GIỜ','Final Sequence','Countdown · Final Puzzle · Choice','Hoàn thành mục tiêu trước khi 72 giờ kết thúc.']];let c=1,ch='ARTHUR',mem=[1,0,0,0,0],time=259200,timer;function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}function go(){show('game');build()}function build(){document.getElementById('chs').innerHTML=D.map((x,i)=>`<button class="ch ${c==i+1?'sel':''}" onclick="chapter(${i+1})">0${i+1} · ${x[0]}</button>`).join('');let x=D[c-1];document.getElementById('main').innerHTML=`<div class="panel"><div class="tiny">CHAPTER 0${c} · GAME FLOW</div><div class="hero"><div class="tiny">${x[1]}</div><h1>${x[0]}</h1><p class="muted">${x[3]}</p><div class="tags">${x[2].split(' · ').map(a=>`<span class="tag">${a}</span>`).join('')}</div><div class="actions"><button class="primary" onclick="play()">TRẢI NGHIỆM CHAPTER</button><button class="ghost" onclick="panel('flow')">GAME FLOW</button></div></div><div class="flow">${['EXPLORE','DISCOVER','SWITCH','SOLVE','REMEMBER'].map(a=>`<div class="node">${a}</div>`).join('')}</div><div id="extra"></div></div>`}function chapter(n){c=n;ch=n==4?'LAUREN':'ARTHUR';build()}function play(){if(c==5){time=259200;clearInterval(timer);timer=setInterval(tick,1000)}document.getElementById('extra').innerHTML=`<div class="hud"><div class="hudtop"><div class="card"><div class="tiny">CHARACTER</div><b id="char">${ch}</b><button class="ghost" onclick="sw()">SWITCH</button></div><div class="card obj"><div class="tiny">OBJECTIVE</div>${D[c-1][3]}</div></div><div class="center"><div class="tiny">${D[c-1][1]}</div><div class="key">[ E ]</div><div>KHÁM PHÁ MÔI TRƯỜNG</div></div><div class="dialog"><div class="tiny" id="speaker">${ch}</div><div id="line">${c==1?'Lauren... cô đang ở đây sao?':c==2?'Có thứ gì đó trong phòng 712.':c==3?'Những mảnh ký ức này đang dẫn tới Sutter Street.':c==4?'Có những thứ tôi đã quên...':'Chúng ta không còn nhiều thời gian nữa.'}</div><button class="choice" onclick="next()">Tiếp tục khám phá →</button><button class="choice" onclick="collect()">✦ Kiểm tra dấu vết ký ức</button></div><div class="bottom"><div class="card">[W][A][S][D] Di chuyển · [E] Tương tác</div><div class="card">${c==5?'<span class="tiny">TIME REMAINING</span> <span id="timer" class="timer">72:00:00</span>':'Memory Shards · '+mem.filter(Boolean).length+'/5'}</div></div></div>`}function sw(){ch=ch=='ARTHUR'?'LAUREN':'ARTHUR';document.getElementById('char').textContent=ch;document.getElementById('speaker').textContent=ch}function next(){let a=['Lauren: Đây từng là nhà của tôi...','Lauren: Em có thể đi qua cánh cửa. Anh thì không.','Lauren: Hãy nhìn nơi ký ức bị đứt đoạn.','Arthur: Có lẽ điều quan trọng không phải chúng ta đã mất gì.','Arthur: Chúng ta phải quyết định ngay.'];document.getElementById('line').textContent=a[c-1]}function collect(){mem[c-1]=1;alert('✦ MEMORY SHARD DISCOVERED\nChapter '+c+' đã được lưu.')}function tick(){time--;let e=document.getElementById('timer');if(!e)return;let h=Math.floor(time/3600),m=Math.floor(time%3600/60),s=time%60;e.textContent=[h,m,s].map(v=>String(v).padStart(2,'0')).join(':');if(time<3600)e.classList.add('danger')}function panel(t){if(t=='flow')document.getElementById('main').innerHTML='<div class="panel"><div class="tiny">GAME FLOW</div><h1>EXPLORE → DISCOVER → SWITCH → SOLVE → REMEMBER</h1><p class="muted">Chapter 5 bổ sung COUNTDOWN → FINAL CHOICE.</p></div>';if(t=='memory')document.getElementById('main').innerHTML='<div class="panel"><div class="tiny">MEMORY ARCHIVE</div><h1>Memory Shards</h1><div class="mem">'+['Russian Hill','Memorial Hospital','Sutter Street','Carmel','Victory Project'].map((x,i)=>`<div class="memory ${mem[i]?'':'lock'}">✦<br><b>${x}</b><br><span class="tiny">${mem[i]?'DISCOVERED':'LOCKED'}</span></div>`).join('')+'</div></div>';if(t=='map')document.getElementById('main').innerHTML='<div class="panel"><div class="tiny">MAP · SAN FRANCISCO</div><h1>Locations</h1><div class="map">'+[['Russian Hill',20,25],['Sutter Street',47,42],['Memorial Hospital',72,30],['Carmel',55,72],['Victory Project',82,67]].map(x=>`<div class="place" style="left:${x[1]}%;top:${x[2]}%"><div class="dot"></div><span>${x[0]}</span></div>`).join('')+'</div></div>'}function info(t,b){alert(t+'\n\n'+b)}build();</script></body></html>
