<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Music — Desktop Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">M</div><span>Music</span></div>
    <div class="nav-label">APPLE-STYLE PLAYER</div>
    <nav>
      <button class="nav-item active" data-view="listen"><span>⌂</span> Nghe ngay</button>
      <button class="nav-item" data-view="browse"><span>◈</span> Duyệt</button>
      <button class="nav-item" data-view="library"><span>▣</span> Thư viện</button>
    </nav>
    <div class="nav-label playlist-label">PLAYLIST</div>
    <nav>
      <button class="nav-item" data-view="favorites"><span>♥</span> Bài hát yêu thích</button>
      <button class="nav-item" data-view="recent"><span>◷</span> Phát gần đây</button>
    </nav>
    <button id="createPlaylist" class="new-playlist">＋ Playlist mới</button>
    <div class="sidebar-bottom"><small>Nhạc của bạn</small><small>Chạy trực tiếp trên trình duyệt</small></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="back-forward"><button>‹</button><button>›</button></div>
      <label class="search"><span>⌕</span><input id="searchInput" placeholder="Tìm kiếm bài hát, nghệ sĩ, album..."></label>
      <button id="importBtn" class="import-btn">＋ Thêm nhạc</button>
      <input id="fileInput" type="file" accept="audio/*" multiple hidden>
    </header>

    <section id="content" class="content"></section>
  </main>

  <footer class="player">
    <div class="now-playing">
      <div id="playerCover" class="mini-cover placeholder">♪</div>
      <div class="track-info"><strong id="playerTitle">Chưa phát nhạc</strong><span id="playerArtist">Thêm file nhạc để bắt đầu</span></div>
      <button id="likeBtn" class="icon-btn" title="Yêu thích">♡</button>
    </div>
    <div class="controls">
      <div class="control-row">
        <button id="shuffleBtn" class="control">⤨</button>
        <button id="prevBtn" class="control">◀</button>
        <button id="playBtn" class="play">▶</button>
        <button id="nextBtn" class="control">▶</button>
        <button id="repeatBtn" class="control">↻</button>
      </div>
      <div class="progress-row"><span id="currentTime">0:00</span><input id="progress" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div>
    </div>
    <div class="volume"><span>◖</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"><span>◕</span></div>
  </footer>
</div>
<audio id="audio"></audio>
<script src="app.js"></script>
</body>
</html>
